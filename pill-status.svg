<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 32" width="262" height="32" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12301f"/><stop offset="1" stop-color="#0d2218"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="260" height="30" rx="9"/></clipPath>
<style>.shine{animation:s 4s ease-in-out infinite}@keyframes s{0%{transform:translateX(-60px) skewX(-20deg)}55%,100%{transform:translateX(322px) skewX(-20deg)}}
.dot{animation:p 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes p{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(2.2);opacity:0}}</style>
</defs>
<rect x="1" y="1" width="260" height="30" rx="9" fill="url(#g)" stroke="#34d399" stroke-width="1.3"/>
<g clip-path="url(#c)"><rect class="shine" x="0" y="-6" width="22" height="44" fill="#fff" opacity=".12"/></g>
<circle class="dot" cx="20" cy="16" r="4" fill="#34d399"/><circle cx="20" cy="16" r="4" fill="#34d399"/>
<text x="38" y="20.5" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#d9fbe8">DISPONIBLE PARA PROYECTOS</text>
</svg>